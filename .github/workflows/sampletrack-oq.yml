name: SampleTrack OQ candidate qualification

on:
  pull_request:
    paths:
      - "demo/**"
      - "validation/**"
      - ".github/workflows/sampletrack-oq.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      SUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OQ_EXECUTION_ID: OQ-CI-${{ github.run_id }}
      OQ_OUTPUT: validation/evidence/OQ-CI-${{ github.run_id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUT_SHA }}
          fetch-depth: 0

      - name: Verify frozen validation authority
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object validation/STL-SD-001-system-description-intended-use.md)" = "d4729f5e0f2b6151dda7b3fc73ba5adf253b8c56"
          test "$(git hash-object validation/STL-RA-001-regulatory-applicability.md)" = "a270ed06c54c43fe94ff4583def0de44594f5b13"
          test "$(git hash-object validation/STL-VP-001-validation-plan.md)" = "6b798621cf44d8ee28c31f7dfeb267fc5ca8c491"
          test "$(git hash-object validation/STL-URS-001-user-requirements.md)" = "673a2739bd817c5c348c94572e65e7e113766118"
          test "$(git hash-object validation/STL-OQ-001-operational-qualification.md)" = "c3e0b589362d3c12650e1ade1290da36db1a3f31"
          test "$(git hash-object validation/fixtures/STL-OQ-001-test-configuration.md)" = "1f4163067d9fc35627ba4cec8253f4cbc94a60bf"

          for blob in             d4729f5e0f2b6151dda7b3fc73ba5adf253b8c56             a270ed06c54c43fe94ff4583def0de44594f5b13             6b798621cf44d8ee28c31f7dfeb267fc5ca8c491             673a2739bd817c5c348c94572e65e7e113766118             0c1a36669f5ee07a219ecd358f63aa62277a1a62             c653b9e8ecb55a608e55594c49649d279400ecae             c3e0b589362d3c12650e1ade1290da36db1a3f31             1f4163067d9fc35627ba4cec8253f4cbc94a60bf
          do
            git cat-file -e "$blob^{blob}"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Capture candidate and environment identity
        shell: bash
        run: |
          mkdir -p "$OQ_OUTPUT"
          {
            echo "MOCK / FICTIONAL — TRAINING & INTERVIEW DEMONSTRATION ONLY — NOT FOR GxP USE"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "git_status_begin"
            git status --porcelain
            echo "git_status_end"
            echo "runner_os=$(uname -a)"
            python --version
            python -c 'import platform, sqlite3, sys; print("architecture="+platform.machine()); print("python_full="+sys.version.replace("\n"," ")); print("sqlite="+sqlite3.sqlite_version)'
          } | tee "$OQ_OUTPUT/qualification-environment.txt"

      - name: Compile candidate
        run: python -m py_compile demo/sampletrack.py demo/test_sampletrack.py demo/test_pressure.py demo/oq_runner.py

      - name: Development unit tests
        working-directory: demo
        run: python -m unittest discover -v

      - name: Source digests
        shell: bash
        run: |
          sha256sum demo/sampletrack.py demo/test_sampletrack.py demo/oq_runner.py \
            | tee "$OQ_OUTPUT/source-sha256.txt"

      - name: Execute frozen OQ once
        id: oq
        continue-on-error: true
        shell: bash
        run: |
          python demo/oq_runner.py \
            --output "$OQ_OUTPUT" \
            --tester "Cameron" \
            --system-identity "$SUT_SHA" \
            --execution-id "$OQ_EXECUTION_ID"

      - name: Summarize OQ
        if: always()
        shell: bash
        run: |
          if [ -f "$OQ_OUTPUT/execution.json" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["OQ_OUTPUT"]) / "execution.json"
          d = json.loads(p.read_text())
          print("OQ summary:", d["summary"])
          failures = []
          for case in d["results"]:
              bad = [s for s in case["steps"] if s["result"] == "FAIL"]
              if bad:
                  failures.append((case["test_id"], bad))
          print("OQ failures:", failures)
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a") as f:
              f.write("# SampleTrack mock OQ\n\n")
              f.write(f"- Candidate: \`{d['system_identity']}\`\n")
              f.write(f"- Result: {d['summary']['pass']} PASS / {d['summary']['fail']} FAIL\n")
              for test_id, steps in failures:
                  f.write(f"- {test_id}: {steps}\n")
          PY
          fi
          if [ -f "$OQ_OUTPUT/execution.json" ]; then
            sha256sum "$OQ_OUTPUT/execution.json" "$OQ_OUTPUT/execution.md" "$OQ_OUTPUT/manifest.json" \
              | tee "$OQ_OUTPUT/execution-sha256.txt"
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampletrack-oq-${{ github.run_id }}
          path: ${{ env.OQ_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failing OQ as failing qualification gate
        if: steps.oq.outcome == 'failure'
        run: |
          echo "Frozen OQ did not pass. See uploaded evidence artifact."
          exit 1
